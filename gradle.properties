#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# LiteRT 2.x ships litert and litert-api with the same namespace.
android.uniquePackageNames=false

#App version (Android; iOS reads MARKETING_VERSION / CURRENT_PROJECT_VERSION from iosApp/Configuration/Config.xcconfig)
#Raise appVersionCode for every store upload.
appVersionCode=1
appVersionName=1.0
